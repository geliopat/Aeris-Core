name: Core CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2.9.3
      - name: Check minimum supported Rust
        run: |
          $package = (cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json).packages | Where-Object name -eq 'aeris-core'
          $minimum = $package.rust_version
          rustup toolchain install $minimum --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo "+$minimum" check --workspace --all-targets --locked
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --release --locked --target x86_64-pc-windows-msvc
      - name: CLI wrapper smoke test
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'aeris-smoke'
          New-Item -ItemType Directory -Force (Join-Path $root 'cli') | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/aeris-core.exe $root
          Copy-Item cli/aeris.cmd (Join-Path $root 'cli')
          $env:PATH = (Join-Path $root 'cli') + ';' + $env:PATH
          Push-Location $env:RUNNER_TEMP
          try {
            $expected = & (Join-Path $root 'aeris-core.exe') version
            if ($LASTEXITCODE -ne 0 -or $expected -notmatch '^Aeris Core \S+$') { throw 'Core version check failed' }
            $result = aeris version
            if ($LASTEXITCODE -ne 0 -or $result -ne $expected) { throw 'CLI smoke test failed' }
          } finally { Pop-Location }
