name: Rust dependency policy
on:
  push:
  pull_request:
  schedule:
    - cron: '13 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dependency-policy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dependency-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review locked Rust dependency graph
        uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda # v2.1.4
        with:
          arguments: '--locked --all-features'
          command: check
          rust-version: stable
